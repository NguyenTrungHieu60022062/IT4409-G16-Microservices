spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý; Hibernate chỉ kiểm tra khớp
  jackson:
    deserialization:
      # Gửi trường lạ (vd "role":"ADMIN") -> 400 thay vì lặng lẽ bỏ qua. Chống mass assignment.
      fail-on-unknown-properties: true

server:
  port: ${PORT:8081}
  error:
    include-message: never        # không lộ thông điệp exception / stack trace ra client
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health           # chỉ mở /actuator/health
  endpoint:
    health:
      show-details: never

auth:
  issuer: ${AUTH_ISSUER:g16-auth-service}
  audience: ${AUTH_AUDIENCE:g16-api}
  access-token-ttl: 15m
  session-ttl: 1d                 # phiên KHÔNG tick "Ghi nhớ đăng nhập"
  remember-me-ttl: 30d            # phiên CÓ tick "Ghi nhớ đăng nhập"
  refresh-reuse-grace: 10s        # 2 tab refresh cùng lúc trong khoảng này -> 409, không coi là bị đánh cắp
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
  # Tạo ADMIN đầu tiên (chỉ khi chưa có admin). Đặt tạm khi khởi động lần đầu rồi xoá. Xem AdminBootstrap.
  bootstrap-admin-email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
  cookie:
    path: /api/auth
    secure: ${AUTH_COOKIE_SECURE:true}
  jwt:
    # Đường dẫn file PEM PKCS#8 (vd file:/run/secrets/jwt-private.pem).
    # Để trống -> tự sinh khoá RSA tạm thời khi khởi động (chỉ hợp cho dev).
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION:}
  lockout:
    max-failures: 5
    window: 15m
    base-lock: 1m
    max-lock: 15m
  rate-limit:
    login-per-minute: 10
    register-per-hour: 10
    refresh-per-minute: 30

logging:
  level:
    root: INFO
